version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
  web:
    build: ./apps/web
    env_file: ./apps/web/.env
    depends_on:
      - api
    ports:
      - "5173:5173"
volumes:
  db_data:
