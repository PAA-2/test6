version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/storage/uploads
      - thumbs_data:/app/storage/thumbnails
  web:
    build: ./apps/web
    env_file: ./apps/web/.env
    depends_on:
      - api
    ports:
      - "5173:5173"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  worker:
    build: ./apps/api
    command: sh -c "rq worker -u $REDIS_URL default"
    env_file: ./apps/api/.env
    depends_on:
      - redis
      - db
    volumes:
      - uploads_data:/app/storage/uploads
      - thumbs_data:/app/storage/thumbnails
  scheduler:
    build: ./apps/api
    command: python -m app.jobs.scheduler
    env_file: ./apps/api/.env
    depends_on:
      - redis
    volumes:
      - uploads_data:/app/storage/uploads
      - thumbs_data:/app/storage/thumbnails
volumes:
  db_data:
  uploads_data:
  thumbs_data:
